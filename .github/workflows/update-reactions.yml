name: Update reaction counts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reactions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build reactions.json from issue reactions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_reactions.py

      - name: Commit and push reaction counts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update issue reaction counts"
            git push
          else
            echo "No count changes; nothing to commit."
          fi