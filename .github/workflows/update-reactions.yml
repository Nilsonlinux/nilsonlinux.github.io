name: Update reaction counts

on:
  schedule:
    # De hora em hora, no minuto 17. Cada commit aqui dispara um build do
    # Pages, e o minuto cheio é o horário mais disputado da agenda do Actions,
    # então evitá-lo reduz a chance de o build ficar na fila.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reactions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build reactions.json from issue reactions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_reactions.py

      - name: Commit and push reaction counts
        run: |
          # Só data/reactions.json é escrito por update_reactions.py, e o
          # plugins.html lê esse arquivo em runtime. Publicar o branch do
          # Pages é o que leva o JSON novo ao ar, então o build continua
          # necessário quando o arquivo muda de verdade — por isso o
          # commit é escopado nesse caminho. Sem escopo, qualquer mudança
          # na árvore de trabalho virava push e um build inútil a cada rodada.
          if [ -z "$(git status --porcelain -- data/reactions.json)" ]; then
            echo "No count changes; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- data/reactions.json
            git commit -m "Update issue reaction counts"
            git push
          fi