name: Sync plugin pages

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-plugins]

permissions:
  contents: write

concurrency:
  group: sync-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate plugin pages from catalog.toml
        run: python scripts/sync_plugins.py

      - name: Commit and push new pages
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Generate plugin page(s) from catalog.toml"
            git push
          else
            echo "No new plugins; nothing to commit."
          fi