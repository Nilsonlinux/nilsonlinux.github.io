<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>NLinux · Nilsonlinux</title>
	<meta name="description" content="A página do NLinux agora é a home do site." />
	<link rel="canonical" href="https://nilsonlinux.github.io/" />
	<meta http-equiv="refresh" content="0; url=index.html" />
	<script>location.replace('index.html' + location.hash + location.search);</script>
	<style>
		:root { color-scheme: dark light; --bg: #070722; --fg: #e6e6f5; }
		html[data-theme="light"] { --bg: #f6f7fb; --fg: #1b1b2f; }
		body {
			margin: 0; min-height: 100dvh; display: grid; place-items: center; gap: .75rem;
			background: var(--bg); color: var(--fg); font: 400 1rem/1.6 Inter, system-ui, sans-serif; text-align: center;
		}
		a { color: #5eead4; }
		p { margin: 0; opacity: .8; font-size: .9rem; }
	</style>
	<script>
		(function () {
			var t = localStorage.getItem('theme');
			if (t !== 'light' && t !== 'dark')
				t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', t);
		})();
	</script>
</head>
<body>
	<p>Redirecionando para a home do <strong>NLinux</strong>…</p>
	<p><a href="index.html">Clique aqui se não for automático</a></p>
</body>
</html>
